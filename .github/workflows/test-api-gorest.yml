name: GoRest API Tests

run-name: "${{ inputs.suite }} tests | workers=${{ inputs.workers }} | run #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative

      workers:
        description: "xdist workers count"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"


# GitHub Pages один, поэтому одновременно публикуем только один отчёт.
concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  run-tests:
    name: Run GoRest API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

      TEST_SUITE: ${{ inputs.suite }}
      PYTEST_WORKERS: ${{ inputs.workers }}

      ALLURE_VERSION: "2.45.0"

      # Одна общая ветка истории для:
      # all / smoke / regression / negative
      HISTORY_BRANCH: allure-history


    steps:

      # ---------------------------------------------------------
      # 1. Получаем код проекта
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------------
      # 2. Проверяем настройки
      # ---------------------------------------------------------

      - name: Validate configuration
        run: |
          : "${BASE_URL:?Set the BASE_URL secret}"
          : "${API_TOKEN:?Set the API_TOKEN secret}"

          case "$TEST_SUITE" in
            all|smoke|regression|negative)
              ;;
            *)
              echo "::error::Unknown test suite: $TEST_SUITE"
              exit 1
              ;;
          esac

          case "$PYTEST_WORKERS" in
            1|2|3|4)
              ;;
            *)
              echo "::error::Unsupported worker count: $PYTEST_WORKERS"
              exit 1
              ;;
          esac

          rm -rf allure-results logs
          mkdir -p allure-results logs

          docker compose config --quiet


      # ---------------------------------------------------------
      # 3. Собираем Docker-образ
      # ---------------------------------------------------------

      - name: Build Docker image
        run: docker compose build "$TEST_SUITE"


      # ---------------------------------------------------------
      # 4. Запускаем выбранные тесты
      #
      # continue-on-error нужен специально:
      # если pytest упадёт, мы всё равно хотим получить
      # логи и Allure-отчёт.
      # ---------------------------------------------------------

      - name: Run selected test suite
        id: tests
        continue-on-error: true
        run: docker compose run --rm "$TEST_SUITE"


      # ---------------------------------------------------------
      # 5. Исправляем права на файлы после Docker
      # ---------------------------------------------------------

      - name: Fix artifact permissions
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" allure-results logs || true


      # ---------------------------------------------------------
      # 6. Проверяем, что pytest действительно создал
      #    Allure results
      # ---------------------------------------------------------

      - name: Check Allure results
        id: results
        if: always()
        run: |
          if compgen -G "allure-results/*-result.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Allure results found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Allure test results were produced."
            exit 1
          fi


      # ---------------------------------------------------------
      # 7. Добавляем информацию о запуске в Allure
      # ---------------------------------------------------------

      - name: Add Allure metadata
        if: steps.results.outputs.available == 'true'
        run: |
          jq -n \
            --arg report_name "GoRest API Tests: $TEST_SUITE" \
            --arg build_name "$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER" \
            --arg build_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson build_order "$GITHUB_RUN_NUMBER" \
            '{
              name: "GitHub Actions",
              type: "github",
              reportName: $report_name,
              buildOrder: $build_order,
              buildName: $build_name,
              buildUrl: $build_url
            }' > allure-results/executor.json

          printf '%s\n' \
            "Test_suite=$TEST_SUITE" \
            "Workers=$PYTEST_WORKERS" \
            "Runner_OS=$RUNNER_OS" \
            "Test_type=API" \
            "Target=GoRest_v2" \
            "CI=GitHub Actions" \
            "Docker=true" \
            > allure-results/environment.properties


      # ---------------------------------------------------------
      # 8. Сохраняем raw results и pytest logs
      # ---------------------------------------------------------

      - name: Upload test logs and Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gorest-results-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            logs/
            allure-results/
          if-no-files-found: warn
          retention-days: 14


      # ---------------------------------------------------------
      # 9. Устанавливаем Java для Allure CLI
      # ---------------------------------------------------------

      - name: Install Java
        if: steps.results.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 10. Устанавливаем Allure CLI
      #
      # Cache специально не используем:
      # workflow получается проще и понятнее.
      # ---------------------------------------------------------

      - name: Install Allure CLI
        if: steps.results.outputs.available == 'true'
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"

          tar \
            -xzf "$RUNNER_TEMP/allure.tgz" \
            -C "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin/allure" --version


      # ---------------------------------------------------------
      # 11. Восстанавливаем историю предыдущего отчёта
      #
      # Используется ОДНА ветка:
      #
      # allure-history
      #
      # независимо от того, запускали мы:
      # all / smoke / regression / negative.
      # ---------------------------------------------------------

      - name: Restore Allure history
        if: steps.results.outputs.available == 'true'
        run: |
          echo "History branch: $HISTORY_BRANCH"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "$HISTORY_BRANCH" > /dev/null 2>&1
          then
            echo "Previous Allure history found."

            git fetch \
              --depth=1 \
              origin \
              "$HISTORY_BRANCH:$HISTORY_BRANCH"

            rm -rf "$RUNNER_TEMP/old-allure-history"
            mkdir -p "$RUNNER_TEMP/old-allure-history"

            git archive \
              --format=tar \
              "$HISTORY_BRANCH" \
              history \
              | tar -x -C "$RUNNER_TEMP/old-allure-history"

            mkdir -p allure-results/history

            cp -R \
              "$RUNNER_TEMP/old-allure-history/history/." \
              allure-results/history/

            echo "Previous history restored."
          else
            echo "No previous Allure history."
            echo "This is normal for the first run."
          fi


      # ---------------------------------------------------------
      # 12. Генерируем Allure
      #
      # Первый отчёт нужен для history.
      #
      # Второй --single-file нужен для GitHub Pages.
      # ---------------------------------------------------------

      - name: Generate Allure reports
        id: report
        if: steps.results.outputs.available == 'true'
        run: |
          allure generate \
            allure-results \
            -o allure-report-history \
            --clean

          allure generate \
            allure-results \
            -o allure-report \
            --clean \
            --single-file

          test -f allure-report/index.html
          test -d allure-report-history/history

          touch allure-report/.nojekyll

          echo "Allure report generated."


      # ---------------------------------------------------------
      # 13. Сохраняем HTML-отчёт как обычный GitHub Artifact
      # ---------------------------------------------------------

      - name: Upload downloadable Allure report
        if: steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: gorest-report-${{ inputs.suite }}-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 14


      # ---------------------------------------------------------
      # 14. Настраиваем GitHub Pages
      # ---------------------------------------------------------

      - name: Configure GitHub Pages
        if: steps.report.outcome == 'success'
        uses: actions/configure-pages@v6


      # ---------------------------------------------------------
      # 15. Загружаем отчёт для GitHub Pages
      # ---------------------------------------------------------

      - name: Upload GitHub Pages artifact
        if: steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report


      # ---------------------------------------------------------
      # 16. Публикуем Allure на GitHub Pages
      # ---------------------------------------------------------

      - name: Deploy Allure report to GitHub Pages
        id: deployment
        if: steps.report.outcome == 'success'
        uses: actions/deploy-pages@v5


      # ---------------------------------------------------------
      # 17. Сохраняем новую общую Allure history
      #
      # Здесь специально используется отдельная служебная
      # ветка allure-history.
      #
      # Force push безопасен в данном случае, потому что эта
      # ветка предназначена ТОЛЬКО для файлов Allure history.
      # ---------------------------------------------------------

      - name: Persist Allure history
        if: steps.report.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan temp-allure-history

          git rm -rf . > /dev/null 2>&1 || true

          mkdir -p history

          cp -R \
            allure-report-history/history/. \
            history/

          git add -f history

          git commit \
            -m "Update Allure history: $TEST_SUITE run $GITHUB_RUN_NUMBER"

          git branch -M "$HISTORY_BRANCH"

          git push \
            --force \
            origin \
            "$HISTORY_BRANCH"

          echo "Allure history saved to branch: $HISTORY_BRANCH"


      # ---------------------------------------------------------
      # 18. Возвращаем workflow статус FAILED,
      #     если pytest действительно упал.
      #
      # До этого момента continue-on-error позволял нам
      # всё равно создать Allure report.
      # ---------------------------------------------------------

      - name: Fail workflow if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1