[pytest]

# Папка, в которой Pytest будет искать тесты
testpaths = tests

# Добавляем корень проекта в Python path,
# чтобы импорты из проекта работали корректно
pythonpath = .


# Дополнительные параметры запуска Pytest
addopts =

    # Показывает краткую информацию о пропущенных,
    # упавших и других тестах после завершения запуска
    -ra

    # Показывает сокращённый traceback при падении теста
    --tb=short

    # Запрещает использовать незарегистрированные markers
    --strict-markers

    # Подробный вывод тестов в консоли
    -v


# Регистрируем свои markers для группировки тестов
markers =

    # Основные критические smoke-тесты
    smoke: critical smoke tests

    # Полный набор regression-тестов
    regression: full regression suite

    # Негативные тесты и проверки ошибок API
    negative: negative/error handling tests


# Не показывать логи прямо в консоли во время запуска тестов
log_cli = false

# Сохранять логи Pytest в этот файл
log_file = logs/pytest.log

# Записывать в файл сообщения уровня INFO и выше
log_file_level = INFO

# Формат строки в log-файле
# Время | уровень лога | имя модуля | сообщение
log_file_format = %(asctime)s %(levelname)s [%(name)s] %(message)s

# Формат даты и времени в log-файле
log_file_date_format = %Y-%m-%d %H:%M:%S